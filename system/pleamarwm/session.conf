# pleamar-wm in the LatteOS session; ~/.config/latteos/pleamar-wm/session.conf replaces this file.
# What this does not say (the monitors) comes from ~/.config/hypr.
layout * leader
# ponytail: every Quickshell window floats, apps too, since a widget can only be told by its command line; upgrade: a title or app_id of their own for widgets
window app=org.quickshell float frame=own
# Programs that draw their own header (system/hypr/latte/bars.lua's list): no title bar of the scene over it.
# GTK 4 programs (GNOME's) take none anyway.
window app=firefox frame=own
window app=org.mozilla.firefox frame=own
window app=zen frame=own
window app=chromium frame=own
window app=chromium-browser frame=own
window app=google-chrome frame=own
window app=brave-browser frame=own
window app=discord frame=own
window app=com.discordapp.Discord frame=own
window app=steam frame=own
window app=com.valvesoftware.Steam frame=own
window app=code frame=own
window app=Code frame=own
window app=code-oss frame=own
window app=spotify frame=own
window app=Spotify frame=own
window app=obsidian frame=own
window app=signal frame=own
window app=org.signal.Signal frame=own
window app=heroic frame=own
window app=com.heroicgameslauncher.hgl frame=own
window app=org.kde.kdenlive frame=own
