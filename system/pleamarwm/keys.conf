# LatteOS's key bindings in pleamar-wm's session, as someone coming from Windows expects them (as system/hypr/latte/keys.lua
# on Hyprland). Not pleamar-wm's `defaults`: those start Marea, who is not in this session. The mouse comes first in LatteOS:
# every one of these is also a drop or a row of a card. ~/.config/latteos/pleamar-wm/keys.conf replaces this file.
# Syntax and actions: `pleamar-wm keys`.

# The launcher: the Windows key alone, let go without another key (patches/pleamar-wm-tap-keys.patch), and Ctrl+Esc without one
bind super_l release   launch pleamar --say goo "emit lens_toggle"
bind super_r release   launch pleamar --say goo "emit lens_toggle"
bind Ctrl+Escape       launch pleamar --say goo "emit lens_toggle"
bind Super+v           launch pleamar --say goo "emit lens_clipboard"
bind Super+Shift+v     launch pleamar --say goo "emit lens_paste_next"
bind Super+s           launch pleamar --say goo "emit lens_mode 0"
bind Super+q           launch pleamar --say goo "emit lens_mode 0"
bind Super+r           launch pleamar --say goo "emit lens_mode 3"
bind Super+c           launch pleamar --say goo "emit lens_mode 4"
bind Ctrl+Shift+Escape launch latte-app monitor
bind Ctrl+Alt+Delete   launch latte-app monitor
bind Super+i           launch latte-app settings
bind Super+a           launch pleamar --say goo "emit quick_toggle"
bind Super+n           launch pleamar --say goo "emit clock_notes"
bind Super+Alt+d       launch pleamar --say goo "emit clock_time"
bind Super+l           launch pleamar --say goo "emit lock_now"
bind Super+t           launch pleamar --say goo "emit kb_toggle"

# Windows
bind Alt+F4            close
bind Alt+Tab           focus_next
bind Alt+Shift+Tab     focus_previous
bind Super+Up          maximize
bind Super+Down        minimize
bind Super+Left        move_left
bind Super+Right       move_right
bind Super+Shift+Left  move_left
bind Super+Shift+Right move_right
bind Super+f           fullscreen
# what acts on several windows: the same calls as on Hyprland, answered by bin/hyprctl
bind Super+m           launch hyprctl eval "latte.win.minimize_all(false)"
bind Super+Shift+m     launch hyprctl eval "latte.win.restore_all()"
bind Super+Home        launch hyprctl eval "latte.win.minimize_all(true)"
bind Super+d           launch hyprctl eval "latte.desk.show()"
bind Super+1           launch hyprctl eval "latte.win.nth(1)"
bind Super+2           launch hyprctl eval "latte.win.nth(2)"
bind Super+3           launch hyprctl eval "latte.win.nth(3)"
bind Super+4           launch hyprctl eval "latte.win.nth(4)"
bind Super+5           launch hyprctl eval "latte.win.nth(5)"
bind Super+6           launch hyprctl eval "latte.win.nth(6)"
bind Super+7           launch hyprctl eval "latte.win.nth(7)"
bind Super+8           launch hyprctl eval "latte.win.nth(8)"
bind Super+9           launch hyprctl eval "latte.win.nth(9)"
# ponytail: new and closed desktops, the next keyboard layout and the magnifier have no action yet: ROADMAP 1D.07

# Desktops (pleamar-wm's pools)
bind Super+Ctrl+Right  workspace_next
bind Super+Ctrl+Left   workspace_previous

# What pleamar-wm offers of its own, kept beside ours (docs/goo/ROZHODNUTIA.md, 2. 11.)
bind Super+Tab         overview
bind Super+w           toggle_free
bind Super+Shift+w     toggle_canvas
bind Super+0           canvas_fit
bind Super+Shift+i     launch pleamar-wm control
bind Super+minus       narrower
bind Super+plus        wider

# The keys a keyboard has for sound and brightness
bind XF86AudioRaiseVolume   repeat locked launch wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bind XF86AudioLowerVolume   repeat locked launch wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind XF86AudioMute          locked launch wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind XF86AudioMicMute       locked launch wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bind XF86MonBrightnessUp    repeat locked launch brightnessctl set 5%+
bind XF86MonBrightnessDown  repeat locked launch brightnessctl set 5%-

# The touchpad, as pleamar-wm has it
gesture swipe3_down    close
gesture swipe3_up      fullscreen
gesture swipe4_left    focus_previous
gesture swipe4_right   focus_next
