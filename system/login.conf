# /var/lib/latteos/login/login.conf: what the login screen shows besides the login itself.
# The latte group may write it, the login screen only reads it.

# under the surface when nothing crashed: "news" (headlines from news_url) or "none"
panel = "news"
# one or more RSS or Atom feeds, separated by spaces
news_url = ""

# where the sky and the weather are looked up
# empty: no sky and no weather on the login screen
lat = ""
lon = ""
place = ""
