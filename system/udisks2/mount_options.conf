# LatteOS: NTFS the way the kernel has it (ntfs3, in Linux itself) before the old FUSE driver, owned by the user who opens it;
# a disk Windows left in use (Fast Startup, hibernation) ntfs3 refuses and ntfs-3g opens only to read (latte-files mount says so)
[defaults]
ntfs_drivers=ntfs3,ntfs
ntfs3_defaults=uid=$UID,gid=$GID,noatime,windows_names,prealloc
ntfs3_allow=uid=$UID,gid=$GID,umask,dmask,fmask,iocharset,discard,nodiscard,sparse,nosparse,hidden,nohidden,sys_immutable,nosys_immutable,showmeta,noshowmeta,prealloc,noprealloc,windows_names,nowindows_names,force,noacsrules,acsrules,hide_dot_files,nohide_dot_files,noatime,relatime,nodiratime
ntfs_defaults=uid=$UID,gid=$GID,windows_names
