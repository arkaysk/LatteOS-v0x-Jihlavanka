[package]
name = "latte-acp"
description = "LatteOS client of the Agent Client Protocol: an agent's work in LensAI instead of a terminal"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
# the official Rust SDK (Apache-2.0, github.com/agentclientprotocol/rust-sdk): the protocol, the agent's process
agent-client-protocol = { version = "5.4", features = ["process"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time"] }
serde_json = "1"
