[package]
name = "latte-chapolera"
description = "Chapolera file scan and media classification helper"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
candle-core = "0.11.1"
candle-nn = "0.11.1"
candle-transformers = "0.11.1"
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }
serde_json = "1"
tokenizers = "0.22.1"
