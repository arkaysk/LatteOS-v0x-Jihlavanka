[workspace]
resolver = "2"
members = ["crates/goo-phys", "crates/latte-hw", "crates/latte-boot", "crates/latte-stats", "crates/latte-props", "crates/latte-chapolera", "crates/latte-index", "crates/latte-index-core"]
exclude = ["old", "build", "crates/latte-goo"]   # build/: what install fetches and builds (pleamar, pleamar-wm); latte-goo is built with them (patches/build-pleamar.sh)

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "LicenseRef-LatteOS-undecided"          # no licence chosen yet (not MIT any more): the final one comes with the final system
authors = ["Arkay"]

[profile.release]
opt-level = "s"
lto = true
strip = true
